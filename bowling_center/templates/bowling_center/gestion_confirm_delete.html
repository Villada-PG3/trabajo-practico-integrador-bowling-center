{% extends 'bowling_center/base.html' %}

{% block title %}{{ titulo }} — Pins & Co.{% endblock %}

{% block content %}
<section class="container-xl py-5">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-5">
      <div class="bg-white card-rounded p-4 p-md-5 shadow-sm">
        <span class="badge-caps d-block mb-2" style="color: var(--brand-primary);">Confirmación</span>
        <h1 class="font-heading fw-bold fs-2 text-dark mb-3">{{ titulo }}</h1>
        <p class="text-muted">¿Seguro que querés eliminar <strong>{{ object }}</strong>? Esta acción no se puede deshacer.</p>
        <form method="post">
          {% csrf_token %}
          <div class="d-flex flex-column flex-sm-row gap-2 mt-4">
            <button class="btn btn-danger flex-grow-1" type="submit">Sí, eliminar</button>
            <a class="btn btn-brand-light" href="{{ volver_url }}">Cancelar</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</section>
{% endblock %}

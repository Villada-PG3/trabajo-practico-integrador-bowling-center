{% extends 'myapp/base.html' %}

{% block title %}Confirmar eliminación{% endblock %}

{% block content %}
<div class="container-xl py-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="bg-white card-rounded p-4 p-md-5 shadow-sm text-center">
        <div class="icon-bubble mx-auto mb-3" style="background:#fee2e2; color:#dc2626; width:56px; height:56px;">
          <i class="bi bi-trash fs-4"></i>
        </div>
        <h1 class="font-heading fw-bold fs-4 mb-2">¿Eliminar {{ tipo }}?</h1>
        <p class="text-muted mb-4">{{ objeto }}</p>

        <form method="post">
          {% csrf_token %}
          <div class="d-flex gap-2 justify-content-center">
            <button type="submit" class="btn btn-danger px-4">Sí, eliminar</button>
            <a href="{% url 'panel' %}" class="btn btn-light px-4">Cancelar</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
